name: Slab
options:
  bundleIdPrefix: com.anthonychan
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  HotKey:
    url: https://github.com/soffes/HotKey
    from: "0.2.1"

targets:
  Slab:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Overlay
      - path: Layouts
      - path: Settings
    resources:
      - path: Resources
    info:
      path: Info.plist
      properties:
        LSUIElement: true
        NSPrincipalClass: NSApplication
        CFBundleName: Slab
        CFBundleDisplayName: Slab
        NSAccessibilityUsageDescription: "Slab needs Accessibility access to move and resize windows."
        NSHumanReadableCopyright: "© 2026 Anthony Chan"
        LSMinimumSystemVersion: "13.0"
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
    entitlements:
      path: Slab.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.automation.apple-events: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.anthonychan.slab
      SWIFT_VERSION: "5.9"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
      CODE_SIGN_STYLE: Automatic
      ENABLE_HARDENED_RUNTIME: true
      ENABLE_PREVIEWS: "NO"
    dependencies:
      - package: HotKey

  SlabTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
    dependencies:
      - target: Slab
    settings:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
